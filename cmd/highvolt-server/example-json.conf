{
  "core": {
    "api_key": "changeme-internal-api-key",
    "minimum_image_size": 5128,
    "max_pdf_pages": 50,
    "max_workers": 4,
    "max_queue_size": 50,
    "queue_directory": "/var/lib/highvolt/queue",
    "temp_file_mode": "0600",
    "max_archive_size": 524288000,
    "archive_extract_timeout": 300,
    "max_body_size": 1073741824,
    "export_command_timeout": 120,
    "mime_types": {
      "text": ["text/plain", "text/csv"],
      "image": ["image/png", "image/jpeg", "image/gif"],
      "pdf": ["application/pdf"],
      "office": [
        "application/msword",
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        "application/vnd.ms-excel",
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      ],
      "archive": ["application/zip", "application/x-tar", "application/gzip"]
    }
  },
  "http": {
    "listen": ":8443",
    "tls": true,
    "cert": "/etc/highvolt/tls/server.crt",
    "key": "/etc/highvolt/tls/server.key",
    "mode": "production"
  },
  "syslog": {
    "host": "local",
    "proto": "tcp"
  },
  "write_backends": ["opensearch"],
  "query_backend": "opensearch",
  "opensearch": {
    "url": "https://opensearch.internal:9200",
    "username": "highvolt",
    "password": "changeme",
    "index": "highvolt",
    "tls_skip_verify": false
  },
  "openobserve": {
    "url": "https://openobserve.internal:5080",
    "username": "highvolt@k9.io",
    "password": "changeme",
    "organization": "default",
    "stream": "highvolt",
    "tls_skip_verify": false
  },
  "llm": {
    "url": "https://api.openai.com/v1",
    "api_key": "changeme-llm-api-key",
    "model": "gpt-4o",
    "timeout": 120,
    "system_prompt": "You are a privacy compliance assistant. You analyze documents for Personally Identifiable Information (PII). Always respond with a single JSON object containing: has_sensitive_data (boolean), confidence (low/medium/high), reasoning (string), description (string).",
    "user_prompt": "Analyze the attached document and determine whether it contains sensitive or personally identifiable information."
  },
  "export_directories": {
    "work": "/var/lib/highvolt/work",
    "archive": "/var/lib/highvolt/archive"
  },
  "export_commands": {
    "pdf": "pdftoppm -png -r 150 %RANGE% %INFILE% %WORKDIR%/%OUTFILE%",
    "office": "soffice --headless --convert-to pdf --outdir %WORKDIR% %INFILE%"
  },
  "haproxy": {
    "enabled": false,
    "port": 8404
  }
}
